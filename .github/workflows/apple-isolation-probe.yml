name: Apple isolation probe

on:
  workflow_dispatch:
  push:
    branches: [docs/split-runner-proof-lanes]
    paths:
      - .github/workflows/apple-isolation-probe.yml
      - proofs/bindings/apple/**

permissions:
  contents: read

jobs:
  benign-probes:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out trusted probes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test benign sandbox boundaries
        run: bash proofs/bindings/apple/run-probes.sh "$RUNNER_TEMP/apple-probe"
      - name: Test candidate hard memory limit
        if: always()
        run: |
          python="$(xcrun --find python3)"
          result=0
          "$python" -I proofs/bindings/apple/probe-memory.py \
            > "$RUNNER_TEMP/apple-probe/memory.log" 2>&1 || result=$?
          cat "$RUNNER_TEMP/apple-probe/memory.log"
          (cd "$RUNNER_TEMP/apple-probe" && shasum -a 256 memory.log >> SHA256SUMS)
          exit "$result"
      - name: Test dedicated-user disk process and CPU limits
        if: always()
        run: |
          result=0
          sudo -n /usr/bin/env GITHUB_ACTIONS=true \
            /bin/bash proofs/bindings/apple/run-resource-probes.sh \
            "$RUNNER_TEMP/apple-probe" 2>&1 \
            | tee "$RUNNER_TEMP/apple-probe/resource-setup.log" || result=$?
          (cd "$RUNNER_TEMP/apple-probe" && shasum -a 256 resource-setup.log >> SHA256SUMS)
          if [ -f "$RUNNER_TEMP/apple-probe/resources.log" ]; then
            (cd "$RUNNER_TEMP/apple-probe" && shasum -a 256 resources.log >> SHA256SUMS)
          fi
          exit "$result"
      - name: Retain probe diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-isolation-probe
          path: ${{ runner.temp }}/apple-probe
          if-no-files-found: error
          retention-days: 7
