name: Apple toolchain preparation

on:
  workflow_call:
    inputs:
      codeql:
        description: Require strict-cell Kotlin extraction and security analysis
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      codeql:
        description: Trace Kotlin compilation in the strict offline build cell
        type: boolean
        default: false
  push:
    branches: [docs/split-runner-proof-lanes]
    paths:
      - .github/workflows/apple-toolchain-preparation.yml
      - proofs/bindings/apple/*.sh
      - proofs/bindings/apple/*.py
      - proofs/bindings/apple/*.sb
      - proofs/bindings/linux-android/bounded-proof.py
      - proofs/bindings/linux-android/**.gradle.kts
      - proofs/bindings/linux-android/gradle.properties

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  benign-preflight:
    uses: ./.github/workflows/apple-isolation-probe.yml
  prepare:
    # Downloads and freezing overlap the benign preflight; each bounded cell
    # waits for that same-run preflight to succeed before it starts.
    name: prepare (${{ matrix.cell }})
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        cell: ${{ fromJSON(inputs.codeql && '["codeql","isolation"]' || '["full"]') }}
    steps:
      - name: Check out trusted preparation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Establish hosted no-swap envelope
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS=true \
            /bin/bash proofs/bindings/apple/disable-hosted-swap.sh
          "$(xcrun --find python3)" -I proofs/bindings/apple/probe-memory.py
      - name: Restore checksum-pinned download archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pinned-archives
          key: apple-pinned-archives-v1-${{ inputs.codeql && 'codeql' || 'base' }}-${{ hashFiles('.github/workflows/apple-toolchain-preparation.yml', 'proofs/bindings/apple/prepare-toolchains.sh', 'proofs/bindings/apple/prepare-codeql.sh') }}
      - name: Download exact pinned JDKs
        run: |
          export CAIRN_ARCHIVE_CACHE="$RUNNER_TEMP/pinned-archives"
          printf 'CAIRN_ARCHIVE_CACHE=%s\n' "$CAIRN_ARCHIVE_CACHE" >> "$GITHUB_ENV"
          /bin/bash proofs/bindings/apple/fetch-pinned.sh \
            'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_aarch64_mac_hotspot_25.0.4.1_1.tar.gz' \
            61979887f7506a24a57439ff99adb8b3a7fc89977d9cfe3b8984f58a981b7b9d \
            "$RUNNER_TEMP/temurin-25.0.4.1.tar.gz" &
          daemon=$!
          /bin/bash proofs/bindings/apple/fetch-pinned.sh \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.12.1_1.tar.gz' \
            3623232f33a9c3baadf304480b2535f9a3cba8a58d42ecbb438ba267315d9998 \
            "$RUNNER_TEMP/temurin-21.0.12.1.tar.gz" &
          compiler=$!
          wait "$daemon"
          wait "$compiler"
          tar -xzf "$RUNNER_TEMP/temurin-25.0.4.1.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/temurin-21.0.12.1.tar.gz" -C "$RUNNER_TEMP"
          printf 'CAIRN_DAEMON_JAVA_HOME=%s/jdk-25.0.4.1+1/Contents/Home\n' \
            "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'JAVA_HOME=%s/jdk-21.0.12.1+1/Contents/Home\n' \
            "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare pinned downloads without a fixture build
        env:
          CODEQL: ${{ inputs.codeql }}
        run: |
          python="$(xcrun --find python3)"
          prepared="$RUNNER_TEMP/apple-preparation"
          "$python" proofs/bindings/linux-android/bounded-proof.py --seconds 1200 \
            "$RUNNER_TEMP/apple-preparation.log" \
            /bin/bash proofs/bindings/apple/prepare-toolchains.sh "$prepared" &
          toolchains=$!
          if [ "$CODEQL" = true ]; then
            codeql_prepared="$RUNNER_TEMP/codeql-preparation"
            mkdir -m 0700 "$codeql_prepared"
            "$python" proofs/bindings/linux-android/bounded-proof.py --seconds 1200 \
              "$codeql_prepared/codeql-preparation.log" \
              /bin/bash proofs/bindings/apple/prepare-codeql.sh "$codeql_prepared" &
            codeql=$!
          fi
          result=0
          wait "$toolchains" || result=$?
          if [ "$CODEQL" = true ]; then wait "$codeql" || result=$?; fi
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          if [ "$CODEQL" = true ]; then
            for input in "$codeql_prepared"/*; do
              test ! -e "$prepared/$(basename "$input")"
              mv "$input" "$prepared/"
            done
            rmdir "$codeql_prepared"
          fi
      - name: Freeze trusted tool copies
        run: |
          rust="$(dirname "$(dirname "$(rustup which --toolchain 1.97.1 rustc)")")"
          sudo -n /usr/bin/env GITHUB_ACTIONS=true \
            /bin/bash proofs/bindings/apple/freeze-toolchains.sh \
            "$RUNNER_TEMP/apple-preparation" "$rust" "$CAIRN_DAEMON_JAVA_HOME" "$JAVA_HOME"
      - name: Verify opt-in CodeQL tool architecture
        if: ${{ inputs.codeql }}
        run: /opt/cairn-apple-tools/codeql/codeql version
      - name: Prepare and freeze Gradle, Cargo and Native inputs in parallel
        run: |
          python="$(xcrun --find python3)"
          prepared="$RUNNER_TEMP/apple-preparation"
          (
            "$python" proofs/bindings/linux-android/bounded-proof.py --seconds 1200 \
              "$prepared/gradle-preparation.log" \
              /bin/bash proofs/bindings/apple/prepare-gradle-inputs.sh "$prepared"
            sudo -n /usr/bin/env GITHUB_ACTIONS=true \
              /bin/bash proofs/bindings/apple/freeze-gradle-inputs.sh "$prepared"
          ) &
          gradle=$!
          (
            "$python" proofs/bindings/linux-android/bounded-proof.py --seconds 1200 \
              "$prepared/cargo-preparation.log" \
              /bin/bash proofs/bindings/apple/prepare-cargo-inputs.sh "$prepared"
            sudo -n /usr/bin/env GITHUB_ACTIONS=true \
              /bin/bash proofs/bindings/apple/freeze-cargo-inputs.sh "$prepared"
            "$python" proofs/bindings/linux-android/bounded-proof.py --seconds 1200 \
              "$prepared/native-preparation.log" \
              /bin/bash proofs/bindings/apple/prepare-native-inputs.sh "$prepared"
            sudo -n /usr/bin/env GITHUB_ACTIONS=true \
              /bin/bash proofs/bindings/apple/freeze-native-inputs.sh "$prepared"
          ) &
          compilers=$!
          result=0
          wait "$gradle" || result=$?
          wait "$compilers" || result=$?
          exit "$result"
      - name: Wait for the same-run benign preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$(xcrun --find python3)" -I proofs/bindings/apple/await-preflight.py \
            --job 'benign-preflight / benign-probes'
      - name: Probe frozen tool startup inside the bounded cell
        env:
          CELL: ${{ matrix.cell }}
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS=true \
            /bin/bash proofs/bindings/apple/run-resource-probes.sh \
            "$RUNNER_TEMP/apple-preparation" /opt/cairn-apple-tools "$CELL" \
            2>&1 | tee "$RUNNER_TEMP/apple-preparation/toolchain-cell.log"
          preparation="$RUNNER_TEMP/apple-preparation"
          "$(xcrun --find python3)" -I proofs/bindings/apple/verify-frozen-inputs.py \
            --root /opt/cairn-apple-tools --jobs "$(sysctl -n hw.ncpu)" \
            --check "$preparation/toolchains.sha256" "$preparation/toolchain-integrity.log" \
            --check "$preparation/gradle-dependencies.sha256" "$preparation/gradle-integrity.log" \
            --check "$preparation/cargo-inputs.sha256" "$preparation/cargo-integrity.log" \
            --check "$preparation/native-inputs.sha256" "$preparation/native-integrity.log"
      - name: Record same-run simulator payload provenance
        if: ${{ matrix.cell == 'full' }}
        run: |
          printf '%s\n' "$GITHUB_SHA" | sudo -n tee \
            "$RUNNER_TEMP/apple-preparation/simulator-payload/revision.txt"
          sudo -n chmod 0444 "$RUNNER_TEMP/apple-preparation/simulator-payload/revision.txt"
      - name: Retain strict-cell Kotlin extraction database
        if: ${{ matrix.cell == 'codeql' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-codeql-java
          path: ${{ runner.temp }}/apple-preparation/codeql-java
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain strict-cell Kotlin coverage and security analysis
        if: ${{ matrix.cell == 'codeql' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-codeql-analysis
          path: ${{ runner.temp }}/apple-preparation/codeql-analysis
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose failed opt-in CodeQL sandbox path operation
        if: ${{ failure() && inputs.codeql }}
        run: |
          "$(xcrun --find python3)" -I -c '
          import subprocess
          subprocess.run([
              "/usr/bin/log", "show", "--last", "2m", "--style", "compact",
              "--predicate", "process == \"kernel\" AND eventMessage CONTAINS \"Sandbox\" AND eventMessage CONTAINS \"java(\" AND eventMessage CONTAINS \"/opt\"",
          ], check=True, timeout=15)
          ' > "$RUNNER_TEMP/apple-preparation/codeql-denials.log"
          cat "$RUNNER_TEMP/apple-preparation/codeql-denials.log"
      - name: Deliver strictly built simulator executable
        if: ${{ matrix.cell == 'full' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-simulator-payload
          path: ${{ runner.temp }}/apple-preparation/simulator-payload
          if-no-files-found: error
          retention-days: 7
      - name: Retain preparation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-toolchain-preparation-${{ matrix.cell }}
          path: |
            ${{ runner.temp }}/apple-preparation.log
            ${{ runner.temp }}/apple-preparation/versions.txt
            ${{ runner.temp }}/apple-preparation/inputs.sha256
            ${{ runner.temp }}/apple-preparation/toolchain*.log
            ${{ runner.temp }}/apple-preparation/toolchains.sha256
            ${{ runner.temp }}/apple-preparation/gradle*.log
            ${{ runner.temp }}/apple-preparation/gradle-dependencies.sha256
            ${{ runner.temp }}/apple-preparation/cargo*.log
            ${{ runner.temp }}/apple-preparation/cargo-inputs.sha256
            ${{ runner.temp }}/apple-preparation/codeql*.log
            ${{ runner.temp }}/apple-preparation/codeql-startup-logs
            ${{ runner.temp }}/apple-preparation/codeql-failed-analysis
            ${{ runner.temp }}/apple-preparation/native*.log
            ${{ runner.temp }}/apple-preparation/native-inputs.sha256
          if-no-files-found: error
          retention-days: 7
  functional-runtime:
    name: Functional simulator runtime (not strict isolation)
    if: ${{ !inputs.codeql }}
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out same-revision runtime harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download same-run simulator payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-simulator-payload
          path: ${{ runner.temp }}/simulator-payload
      - name: Verify delivered Mach-O platform and architecture
        run: |
          binary="$RUNNER_TEMP/simulator-payload/CairnSimulatorSmoke.kexe"
          test "$(xcrun lipo -archs "$binary")" = arm64
          xcrun vtool -show-build "$binary" | tee "$RUNNER_TEMP/simulator-build-version.log"
          awk '
            $1 == "platform" && $2 == "IOSSIMULATOR" { platform_matches++ }
            $1 == "minos" && $2 == "15.0" { floor_matches++ }
            END { exit !(platform_matches == 1 && floor_matches == 1) }
          ' "$RUNNER_TEMP/simulator-build-version.log"
      - name: Execute canonical generated consumer on fresh simulator
        run: |
          "$(xcrun --find python3)" proofs/bindings/linux-android/bounded-proof.py --seconds 480 \
            "$RUNNER_TEMP/functional-runtime.log" \
            "$(xcrun --find python3)" -I proofs/bindings/apple/run-functional-simulator.py \
            "$RUNNER_TEMP/simulator-payload" "$RUNNER_TEMP/cairn-functional"
          grep -Fx 'PASS: typed overflow crossed FFI' "$RUNNER_TEMP/functional-runtime.log"
          grep -Fx 'PASS: value, boundary, typed error and object lifetime' "$RUNNER_TEMP/functional-runtime.log"
          grep -Fx 'PASS: delivered generated simulator consumer exited successfully' \
            "$RUNNER_TEMP/functional-runtime.log"
      - name: Shut down and delete only the recorded functional device
        if: always()
        run: |
          "$(xcrun --find python3)" proofs/bindings/linux-android/bounded-proof.py --seconds 75 \
            "$RUNNER_TEMP/functional-cleanup.log" \
            "$(xcrun --find python3)" -I proofs/bindings/apple/run-functional-simulator.py --cleanup \
            "$RUNNER_TEMP/simulator-payload" "$RUNNER_TEMP/cairn-functional"
      - name: Retain explicitly functional-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-functional-runtime
          path: |
            ${{ runner.temp }}/functional-*.log
            ${{ runner.temp }}/simulator-build-version.log
          if-no-files-found: error
          retention-days: 7
