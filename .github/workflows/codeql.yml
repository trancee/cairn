name: CodeQL advanced

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload verified analyses after default-setup cutover
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 2'

permissions:
  contents: read

jobs:
  existing-languages:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize existing language analysis
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: linked
          ram: 2048
          threads: 2
          config: |
            threat-models: [remote]
      - name: Analyze without weakening the default suite
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: ${{ (github.event_name != 'workflow_dispatch' || inputs.upload) && 'always' || 'never' }}
          upload-database: false
          wait-for-processing: true
      - name: Retain analysis for cutover verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 7
  kotlin-analysis:
    uses: ./.github/workflows/apple-toolchain-preparation.yml
    with:
      codeql: true
  kotlin-results:
    name: CodeQL (compiled Kotlin results)
    needs: kotlin-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out the analyzed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Receive same-run strict-cell results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-codeql-analysis
          path: ${{ runner.temp }}/kotlin-results
      - name: Upload only mapped Kotlin SARIF
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/kotlin-results/java-kotlin.sarif
          category: /language:java-kotlin
          wait-for-processing: true
