name: Fresh DK runtime diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/fresh-dk-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - name: Install exact failing-run binaries
        run: |
          tools="$RUNNER_TEMP/fresh-dk-tools"
          mkdir -p "$tools/maude"
          cd "$tools"
          curl --fail --silent --show-error --location \
            https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz \
            --output tamarin.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            --output maude.zip
          sha256sum --check --strict <<'CHECKSUMS'
          201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz
          72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip
          CHECKSUMS
          tar -xzf tamarin.tar.gz
          unzip -q maude.zip -d maude
          printf '%s\n' "$tools" "$tools/maude" >> "$GITHUB_PATH"
          printf 'MAUDE_LIB=%s\n' "$tools/maude" >> "$GITHUB_ENV"
      - name: Repeat unchanged final replay twenty times
        run: |
          python3 .github/scripts/fresh-dk-diagnostic.py "$RUNNER_TEMP/fresh-dk-results"
      - name: Retain diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-dk-runtime
          path: ${{ runner.temp }}/fresh-dk-results
          if-no-files-found: error
          retention-days: 7
