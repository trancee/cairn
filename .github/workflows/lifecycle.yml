name: Lifecycle verification

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The account runs at most 20 jobs at once. Matrix order starts the
      # longest cells first; the core checks and native budgets run in
      # separate cells so neither waits for the other.
      matrix:
        include:
          - name: lifecycle
            replay: ''
          - name: native-budgets
            replay: ''
          - name: replay-default-witness
            replay: '--target lost_data_recovery'
          - name: replay-refined-witness
            replay: '--disclosure-sources --target lost_data_recovery'
          - name: replay-executable
            replay: '--disclosure-sources --target executable'
          - name: replay-candidate-recovery-witness
            replay: '--disclosure-sources --target initiator_candidate_recovery'
          - name: replay-fresh-epoch-witness
            replay: '--disclosure-sources --target fresh_epoch_after_compromise'
          - name: replay-kem_ciphertext_origin
            replay: '--disclosure-sources --target kem_ciphertext_origin'
          - name: replay-kem_and_ct_tail_origin
            replay: '--disclosure-sources --target kem_and_ct_tail_origin'
          - name: replay-complete-safety
            replay: '--disclosure-sources --target complete_safety'
          - name: replay-fresh_dk_origin
            replay: '--disclosure-sources --target fresh_dk_origin'
          - name: replay-encrypted_origin
            replay: '--disclosure-sources --target encrypted_origin'
          - name: replay-extract_origin
            replay: '--disclosure-sources --target extract_origin'
          - name: replay-ratchet_key_origin
            replay: '--disclosure-sources --target ratchet_key_origin'
          - name: replay-session_key_origin
            replay: '--disclosure-sources --target session_key_origin'
          - name: replay-initial_ck_secret
            replay: '--disclosure-sources --target initial_ck_secret'
          - name: replay-fresh_ss_origin
            replay: '--disclosure-sources --target fresh_ss_origin'
          - name: replay-encrypted_ct_tail_encapsulated
            replay: '--disclosure-sources --target encrypted_ct_tail_encapsulated'
          - name: mutation-classic-fallback
            replay: ''
            mutation: CLASSIC_FALLBACK
          - name: mutation-no-prefix-guard
            replay: ''
            mutation: NO_PREFIX_GUARD
    defaults:
      run:
        shell: bash
    steps:
      - name: Record the native budget diagnostic clock
        if: matrix.name == 'native-budgets'
        run: |
          started="$(python3 -c 'import time; print(time.monotonic())')"
          printf 'CAIRN_LIFECYCLE_STARTED_AT=%s\n' "$started" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - name: Restore checksum-pinned proof archives
        id: proof-archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lifecycle-tools/tamarin.tar.gz
            ${{ runner.temp }}/lifecycle-tools/maude.zip
            ${{ runner.temp }}/lifecycle-tools/lean.zip
          key: proof-archives-${{ runner.os }}-${{ runner.arch }}-tamarin1.12.0-maude3.5.1-lean4.34.1
      - name: Install checksum-pinned proof tools
        run: |
          tools="$RUNNER_TEMP/lifecycle-tools"
          mkdir -p "$tools/maude"
          cd "$tools"
          if [[ '${{ steps.proof-archives.outputs.cache-hit }}' != true ]]; then
          curl --fail --silent --show-error --location \
            https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz \
            --output tamarin.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            --output maude.zip
          curl --fail --silent --show-error --location \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.zip \
            --output lean.zip
          fi
          sha256sum --check --strict <<'CHECKSUMS'
          201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz
          72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip
          3013aba02bb8bf31b1cf8c9d956d60fb95bb1c10920dfe91abcaa59cb461ddac  lean.zip
          CHECKSUMS
          tar -xzf tamarin.tar.gz
          unzip -q maude.zip -d maude
          unzip -q lean.zip
          printf '%s\n' "$tools" "$tools/maude" "$tools/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
          printf 'MAUDE_LIB=%s\n' "$tools/maude" >> "$GITHUB_ENV"
      # T3: native-proxy is an internal host proof tool, excluded from SDK coverage.
      # Its static, CLI/native-stream, process and budget gates run in this workflow.
      - name: Build the source-identified native guard
        run: |
          rustup show active-toolchain
          target="$RUNNER_TEMP/cairn-maude-proxy"
          cargo build --release --locked \
            --manifest-path docs/spec/models/equations/native-proxy/Cargo.toml \
            --target-dir "$target"
          printf 'CARGO_TARGET_DIR=%s\n' "$target" >> "$GITHUB_ENV"
      - name: Check fast gates, lifecycle proofs, equation convergence/image and source projection
        if: matrix.name == 'lifecycle'
        run: scripts/check.sh
      - name: Check representative and startup-only native guard budgets
        id: native-budgets
        if: matrix.name == 'native-budgets'
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/native-budget"
          for workload in full-export startup; do
            printf 'workload=%s\n' "$workload" >> "$GITHUB_OUTPUT"
            python3 docs/spec/models/equations/native-proxy/experiment.py \
              --proxy "$CARGO_TARGET_DIR/release/cairn-maude-proxy" --workload "$workload" \
              | tee "$RUNNER_TEMP/native-budget/normal-$workload.json"
          done
      - name: Capture one bounded diagnostic after a native budget failure
        if: ${{ failure() && !cancelled() && matrix.name == 'native-budgets' && steps.native-budgets.outcome == 'failure' }}
        timeout-minutes: 5
        env:
          FAILED_WORKLOAD: ${{ steps.native-budgets.outputs.workload }}
        run: |
          python3 docs/spec/models/equations/native-proxy/capture_failure.py \
            --report "$RUNNER_TEMP/native-budget/normal-$FAILED_WORKLOAD.json" \
            --workload "$FAILED_WORKLOAD" \
            --proxy "$CARGO_TARGET_DIR/release/cairn-maude-proxy" \
            --output "$RUNNER_TEMP/native-budget" \
            --job-started-at "$CAIRN_LIFECYCLE_STARTED_AT"
      - name: Retain the original failed report and separate diagnostic evidence
        if: ${{ always() && matrix.name == 'native-budgets' && steps.native-budgets.outcome == 'failure' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-budget-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-budget/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Check exact-source witness replay
        if: matrix.name != 'lifecycle' && matrix.name != 'native-budgets' && !matrix.mutation
        env:
          REPLAY_ARGUMENTS: ${{ matrix.replay }}
        run: |
          read -r -a arguments <<< "$REPLAY_ARGUMENTS"
          python3 docs/spec/models/replay.py "${arguments[@]}"
      - name: Check native guard mutation sensitivity
        if: matrix.mutation
        env:
          MUTATION: ${{ matrix.mutation }}
        run: python3 docs/spec/models/mutation.py --mutation "$MUTATION" --timeout 180
