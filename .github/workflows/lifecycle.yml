name: Lifecycle verification

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
      - name: Install checksum-pinned proof tools
        run: |
          tools="$RUNNER_TEMP/lifecycle-tools"
          mkdir -p "$tools/maude"
          cd "$tools"
          curl --fail --silent --show-error --location \
            https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz \
            --output tamarin.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            --output maude.zip
          curl --fail --silent --show-error --location \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.zip \
            --output lean.zip
          sha256sum --check --strict <<'CHECKSUMS'
          201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz
          72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip
          3013aba02bb8bf31b1cf8c9d956d60fb95bb1c10920dfe91abcaa59cb461ddac  lean.zip
          CHECKSUMS
          tar -xzf tamarin.tar.gz
          unzip -q maude.zip -d maude
          unzip -q lean.zip
          printf '%s\n' "$tools" "$tools/maude" "$tools/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
          printf 'MAUDE_LIB=%s\n' "$tools/maude" >> "$GITHUB_ENV"
      - name: Check fast gates, lifecycle proofs and source projection
        run: scripts/check.sh
      - name: Check exact-source witness replay
        run: |
          python3 docs/spec/models/replay.py
          python3 docs/spec/models/replay.py --disclosure-sources
          for target in kem_ciphertext_origin fresh_dk_origin encrypted_origin extract_origin ratchet_key_origin session_key_origin initial_ck_secret fresh_ss_origin; do
            python3 docs/spec/models/replay.py --disclosure-sources --target "$target"
          done
