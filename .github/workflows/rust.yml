name: Rust foundation

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: rust-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/Cargo.lock') }}
      - name: Install pinned Rust and gate tools
        id: gate-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: gate-deny-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-deny0.20.2
      - name: Resolve Rust and install uncached gate tool
        run: |
          rustup show active-toolchain
          if [[ '${{ steps.gate-tools.outputs.cache-hit }}' != true ]]; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
      - name: Check workspace and both backends
        run: bash scripts/check-rust.sh
  interpreters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/Cargo.lock') }}
      - name: Install pinned interpreter toolchain
        id: interpreter-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-careful
          key: gate-careful-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-careful0.4.10
      - name: Resolve interpreter tools
        run: |
          rustup toolchain install nightly-2026-10-08 --profile minimal --component miri,rust-src
          if [[ '${{ steps.interpreter-tools.outputs.cache-hit }}' != true ]]; then
            cargo install cargo-careful --version 0.4.10 --locked
          fi
      - name: Check wire under Miri and crypto under careful
        working-directory: core
        run: |
          cargo +nightly-2026-10-08 miri test -p cairn-wire --locked
          cargo +nightly-2026-10-08 careful test -p cairn-crypto --all-features --locked
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/Cargo.lock') }}
      - name: Install pinned coverage tools
        id: coverage-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: gate-coverage-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-llvmcov0.9.1
      - name: Resolve coverage tools
        run: |
          rustup toolchain install nightly-2026-10-08 --profile minimal --component llvm-tools
          if [[ '${{ steps.coverage-tools.outputs.cache-hit }}' != true ]]; then
            cargo install cargo-llvm-cov --version 0.9.1 --locked
          fi
      - name: Require complete maintained-source coverage
        # Internal fuzz/ and ct/ workspaces are excluded; maintained crates remain covered.
        working-directory: core
        run: |
          cargo +nightly-2026-10-08 llvm-cov --workspace --all-features --locked --branch \
            --json --output-path "$RUNNER_TEMP/coverage.json"
          python3 - "$RUNNER_TEMP/coverage.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as report:
              totals = json.load(report)["data"][0]["totals"]
          for metric in ("lines", "branches"):
              result = totals[metric]
              if result["count"] == 0 or result["covered"] != result["count"]:
                  raise SystemExit(f"incomplete {metric} coverage: {result}")
          PY
  android-cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/Cargo.lock') }}
      - name: Install pinned Android cross-build tools
        id: android-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: gate-ndk-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-cargondk4.1.2
      - name: Resolve Android cross-build tools
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          if [[ '${{ steps.android-tools.outputs.cache-hit }}' != true ]]; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - name: Compile API 26 foundation libraries for three ABIs
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            build --workspace --all-features --release --locked
  apple-cross-build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/Cargo.lock') }}
      - name: Install Apple target libraries
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Compile device and simulator foundation libraries
        working-directory: core
        run: |
          cargo build --workspace --all-features --release --locked --target aarch64-apple-ios
          cargo build --workspace --all-features --release --locked --target aarch64-apple-ios-sim
  secret-taint:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/Cargo.lock') }}
      - name: Install Memcheck build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind clang libclang-dev pkg-config
          rustup show active-toolchain
      - name: Check internal harness
        run: cargo clippy --manifest-path core/ct/Cargo.toml --all-targets --locked -- -D warnings
      - name: Reject secret-dependent branches and addresses
        run: bash scripts/check-ct.sh
  fuzz:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/**/Cargo.lock') }}
      - name: Install pinned fuzz tools
        id: fuzz-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: gate-fuzz-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-fuzz0.13.2
      - name: Resolve fuzz tools
        run: |
          rustup toolchain install nightly-2026-10-08 --profile minimal
          if [[ '${{ steps.fuzz-tools.outputs.cache-hit }}' != true ]]; then
            cargo install cargo-fuzz --version 0.13.2 --locked
          fi
      - name: Fuzz canonical wire encodings
        working-directory: core
        run: |
          cargo +nightly-2026-10-08 fuzz run wire_encoding -- \
            -max_total_time=60 -max_len=65540 -seed=20261009
