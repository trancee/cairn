[package]
name = "cairn-crypto"
description = "Cairn cryptographic backend seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aws-lc", "reference"]
aws-lc = ["dep:aws-lc-rs"]
reference = [
    "dep:sha2",
    "dep:hmac",
    "dep:hkdf",
    "dep:ml-kem",
    "dep:x25519-dalek",
    "dep:sha3",
    "dep:shake",
    "dep:getrandom",
    "dep:aes-gcm",
]

[dependencies]
aws-lc-rs = { version = "1.18.1", optional = true }
sha2 = { version = "0.11.0", optional = true, features = ["zeroize"] }
hmac = { version = "0.13.0", optional = true, features = ["zeroize"] }
hkdf = { version = "0.13.0", optional = true }
zeroize = { version = "1.8", features = ["alloc"] }
ml-kem = { version = "0.3.3", default-features = false, features = ["hazmat", "zeroize"], optional = true }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"], optional = true }
sha3 = { version = "0.12.0", optional = true }
getrandom = { version = "0.4.3", optional = true }
shake = { version = "0.1.0", optional = true }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
