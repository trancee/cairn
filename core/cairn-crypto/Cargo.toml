[package]
name = "cairn-crypto"
description = "Cairn symmetric cryptographic backend seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aws-lc", "reference"]
aws-lc = ["dep:aws-lc-rs"]
reference = ["dep:sha2", "dep:hmac", "dep:hkdf"]

[dependencies]
aws-lc-rs = { version = "1.18.1", optional = true }
sha2 = { version = "0.11.0", optional = true, features = ["zeroize"] }
hmac = { version = "0.13.0", optional = true, features = ["zeroize"] }
hkdf = { version = "0.13.0", optional = true }
zeroize = { version = "1.8", features = ["alloc"] }

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
