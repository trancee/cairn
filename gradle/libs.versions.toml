# ADR 0020 owns this tuple; Kotlin 2.4.21 fully supports Gradle 9.7.0 and AGP 9.3.1.
[versions]
agp = "9.3.1"
android-compileSdk = "37"
android-minSdk = "26"
android-ndk = "30.0.16248370"
androidx-activity = "1.13.0"
# The Compose BOM pins material3 1.4.0 with ui and ui-test 1.12.1 (ADR 0023 §5).
androidx-compose-bom = "2026.09.00"
androidx-test-core = "1.7.0"
# Compose ui-test pulls Espresso 3.5.0, whose idling breaks on the API 37 framework (ADR 0023 §4).
androidx-test-espresso = "3.7.0"
junit = "4.13.2"
jvm-toolchain = "21"
kotlin = "2.4.21"
kover = "0.9.11"
robolectric = "4.17"
sqldelight = "2.4.1"
# The android-all jars Robolectric 4.17 runs for API 26 and 37; host tests load them offline (ADR 0023 §4).
robolectric-sdk26 = "8.0.0_r4-robolectric-r1-i7"
robolectric-sdk37 = "17-robolectric-15733970-i7"
ubique-uniffi = "1.3.2"
# Patched-version floors for vulnerable transitive build tooling (AGP, UTP, bundletool, Kover, KGP); see ADR 0020.
floor-bouncycastle = "1.86"
floor-commons-lang3 = "3.21.0"
floor-freemarker = "2.3.35"
floor-httpcomponents = "4.5.14"
floor-jdom2 = "2.0.6.1"
floor-jose4j = "0.9.7"
floor-netty = "4.1.139.Final"
floor-opentelemetry = "1.62.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
robolectric-android-all-sdk26 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk26" }
robolectric-android-all-sdk37 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk37" }
floor-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "floor-bouncycastle" }
floor-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "floor-bouncycastle" }
floor-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "floor-bouncycastle" }
floor-freemarker = { module = "org.freemarker:freemarker", version.ref = "floor-freemarker" }
floor-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "floor-commons-lang3" }
floor-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "floor-httpcomponents" }
floor-httpmime = { module = "org.apache.httpcomponents:httpmime", version.ref = "floor-httpcomponents" }
floor-jdom2 = { module = "org.jdom:jdom2", version.ref = "floor-jdom2" }
floor-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "floor-jose4j" }
floor-netty-buffer = { module = "io.netty:netty-buffer", version.ref = "floor-netty" }
floor-netty-codec = { module = "io.netty:netty-codec", version.ref = "floor-netty" }
floor-netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "floor-netty" }
floor-netty-codec-http2 = { module = "io.netty:netty-codec-http2", version.ref = "floor-netty" }
floor-netty-codec-socks = { module = "io.netty:netty-codec-socks", version.ref = "floor-netty" }
floor-netty-common = { module = "io.netty:netty-common", version.ref = "floor-netty" }
floor-netty-handler = { module = "io.netty:netty-handler", version.ref = "floor-netty" }
floor-netty-handler-proxy = { module = "io.netty:netty-handler-proxy", version.ref = "floor-netty" }
floor-netty-resolver = { module = "io.netty:netty-resolver", version.ref = "floor-netty" }
floor-netty-transport = { module = "io.netty:netty-transport", version.ref = "floor-netty" }
floor-netty-transport-native-unix-common = { module = "io.netty:netty-transport-native-unix-common", version.ref = "floor-netty" }
floor-opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "floor-opentelemetry" }
floor-opentelemetry-context = { module = "io.opentelemetry:opentelemetry-context", version.ref = "floor-opentelemetry" }

[bundles]
build-tool-floors = [
    "floor-bcpkix",
    "floor-bcprov",
    "floor-bcutil",
    "floor-commons-lang3",
    "floor-freemarker",
    "floor-httpclient",
    "floor-httpmime",
    "floor-jdom2",
    "floor-jose4j",
    "floor-netty-buffer",
    "floor-netty-codec",
    "floor-netty-codec-http",
    "floor-netty-codec-http2",
    "floor-netty-codec-socks",
    "floor-netty-common",
    "floor-netty-handler",
    "floor-netty-handler-proxy",
    "floor-netty-resolver",
    "floor-netty-transport",
    "floor-netty-transport-native-unix-common",
    "floor-opentelemetry-api",
    "floor-opentelemetry-context",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
ubique-uniffi = { id = "ch.ubique.uniffi.plugin", version.ref = "ubique-uniffi" }
