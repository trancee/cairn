gradle.projectsEvaluated {
    def sdk = gradle.rootProject.project(":sdk")
    def targets = sdk.extensions.getByName("kotlin").targets.collect { it.name }.sort()
    def expected = ["iosArm64", "iosSimulatorArm64", "jvm", "metadata"]
    if (targets != expected) {
        throw new GradleException("FAIL: Apple SDK targets ${targets}; expected ${expected}")
    }
    println("PASS: effective Apple SDK targets ${targets}; configuration only")
    def cargoDirectory = sdk.extensions.getByName("cargo").targetDirectory.get().asFile
    def bindgenDirectory = sdk.tasks.named("installBindgen").get().bindgenBuildPath.get().asFile
    if (bindgenDirectory.canonicalFile != cargoDirectory.canonicalFile) {
        throw new GradleException("FAIL: bindgen and fixture Cargo target directories differ")
    }
    println("PASS: effective bindgen build directory shares the fixture Cargo target; configuration only")
}
